<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structure & Property - Connection Match</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --graphite: #1C2B33; --graphite2: #142027; --steel: #3E5C67; --steel-light: #E3EAEC;
            --copper: #D98E3B; --copper-light: #F6E4C8; --robot-blue: #2A5C7A; --robot-blue-light: #DCEAF1;
            --ink: #23343C; --muted: #5C7079; --card: #F4F2EE; --white: #FFFFFF;
            --good: #3E7A52; --good-bg: #E7F3EA; --warn: #9A6B1E; --warn-bg: #FBF0DC; --bad: #A23B3B; --bad-bg: #FBEAEA;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { background-color: var(--graphite); color: var(--ink); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }

        #app { background-color: var(--white); width: 100%; max-width: 900px; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.35); overflow: hidden; display: flex; flex-direction: column; min-height: 650px; }
        .header { padding: 30px 40px 20px; border-bottom: 2px solid var(--steel-light); }
        .content { padding: 30px 40px; flex-grow: 1; overflow-y: auto; background-color: #FAFAFA; }
        .footer { padding: 20px 40px; background-color: var(--white); border-top: 2px solid var(--steel-light); display: flex; justify-content: space-between; align-items: center; }

        h1, h2, h3 { font-family: 'Fraunces', serif; color: var(--graphite); }
        h1 { font-size: 28px; line-height: 1.2; margin-bottom: 8px; }
        h2 { font-size: 22px; margin-bottom: 12px; }
        .eyebrow { text-transform: uppercase; font-size: 13px; font-weight: 700; letter-spacing: 1px; color: var(--copper); margin-bottom: 6px; display: block; }
        p { font-size: 16px; line-height: 1.5; color: var(--muted); margin-bottom: 16px; }

        .name-gate { background-color: var(--robot-blue-light); padding: 20px; border-radius: 12px; margin-bottom: 24px; }
        .name-gate label { display: block; font-weight: 600; color: var(--robot-blue); margin-bottom: 8px; }
        .name-gate input, .name-gate select { width: 100%; padding: 12px 16px; border: 2px solid var(--robot-blue); border-radius: 8px; font-size: 16px; outline: none; background:#fff; font-family:'Inter',sans-serif; }
        .name-gate input:focus, .name-gate select:focus { box-shadow: 0 0 0 3px rgba(42, 92, 122, 0.2); }

        .btn-primary { background-color: var(--copper); color: var(--white); border: none; padding: 14px 28px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s;}
        .btn-primary:hover:not(:disabled) { background-color: #C07A2E; transform: translateY(-1px); }
        .btn-primary:disabled { background-color: var(--muted); opacity: 0.5; cursor: not-allowed; }

        .match-container { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        
        .left-col { display: flex; flex-direction: column; gap: 12px; }
        .left-item { background: var(--white); border: 2px solid var(--steel-light); border-radius: 8px; padding: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; display:flex; justify-content:space-between; align-items:center;}
        .left-item:hover { border-color: var(--muted); }
        .left-item.active { border-color: var(--copper); background-color: var(--copper-light); color: var(--graphite2); }
        .left-item.matched { border-color: var(--good); background-color: var(--good-bg); color: var(--good); cursor: default; }

        .right-col { display: flex; flex-direction: column; gap: 12px; }
        .right-chip { background-color: var(--card); border: 2px solid transparent; color: var(--muted); padding: 16px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: all 0.2s; user-select: none; }
        .right-chip:hover:not(.locked) { background-color: var(--steel-light); color: var(--ink); }
        .right-chip.locked { background-color: var(--steel-light); opacity: 0.5; cursor: default; border-color: var(--muted); }

        .progress-pill { background-color: var(--robot-blue-light); color: var(--robot-blue); padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: 700; }

        .score-badge { width: 120px; height: 120px; border-radius: 60px; background-color: var(--graphite); color: var(--copper); display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0 auto 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        .score-badge .num { font-family: 'Fraunces', serif; font-size: 36px; font-weight: 700; line-height: 1; }
        .score-badge .lbl { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

        .result-row { background: var(--white); border-radius: 12px; padding: 16px; margin-bottom: 16px; border-left: 6px solid transparent; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .result-row.correct { border-left-color: var(--good); background-color: var(--good-bg); }
        .result-row.incorrect { border-left-color: var(--bad); background-color: var(--bad-bg); }

        .submit-status { font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 6px; }
        .submit-status.ok { color: var(--good); background-color: var(--good-bg); }
        .submit-status.warn { color: var(--warn); background-color: var(--warn-bg); }
        
        @media (max-width: 700px) {
            .match-container { grid-template-columns: 1fr; gap: 20px; }
            .header, .content, .footer { padding: 20px; }
            .footer { flex-direction: column; gap: 15px; align-items: stretch; text-align: center; }
            .btn-primary { width: 100%; }
        }
    
  /* ============================================================
     MOBILE-HARDENING (universal, appended) — v1
     Fixes: horizontal overflow, small tap targets, font sizing,
            spacing on narrow screens. Safe overrides.
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { max-width: 100%; overflow-x: hidden; }
  img, svg, video, canvas, table { max-width: 100%; height: auto; }
  /* long words / URLs shouldn't push the layout wide */
  p, h1, h2, h3, li, td, th, .chip, .btn { overflow-wrap: break-word; word-break: break-word; }
  /* wrap wide tables in a horizontal scroller instead of breaking the page */
  .table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }

  @media (max-width: 640px) {
    /* comfortable page gutters */
    body { padding-left: 14px; padding-right: 14px; }
    .app, .panel, .wrap, .container, main { max-width: 100% !important; }
    /* tighten oversized card padding on phones */
    .panel { padding: 20px 16px !important; border-radius: 14px !important; }
    /* fluid headings so they never overflow */
    h1 { font-size: clamp(24px, 7vw, 34px) !important; line-height: 1.12; }
    h2 { font-size: clamp(20px, 5.5vw, 26px) !important; }
    h3 { font-size: clamp(17px, 4.8vw, 21px) !important; }
    /* single-column any multi-column grid */
    .missions, .mission-grid, .grid, [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
    /* generous tap targets (Apple/Google guidance = 44px min) */
    .btn, button, .chip, a.card, .card-link, select { min-height: 44px; }
    .chip { padding: 11px 14px !important; font-size: 14px !important; }
    .btn, button { padding: 13px 18px !important; font-size: 15px !important; }
    /* inputs at >=16px stop iOS from auto-zooming on focus */
    input, select, textarea { font-size: 16px !important; width: 100%; }
    /* stack any flex header rows */
    .top, .mission-header, .score-hero, .app-header, header { flex-wrap: wrap; }
  }
  @media (max-width: 380px) {
    .panel { padding: 16px 12px !important; }
    .chip { font-size: 13.5px !important; }
  }


@media print { body { background: white !important; color: black !important; } .name-gate, .btn, button, .top-bar, .actions { display: none !important; } .mission-card, .round-card, .card { display: block !important; box-shadow: none !important; border: 1px solid #ccc !important; margin-bottom: 20px !important; page-break-inside: avoid; } .hidden { display: block !important; } .mcq-option::before { content: '[  ] '; font-family: monospace; } .category-bucket { border: 1px solid #000 !important; min-height: 150px; } }
</style>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

    <div id="app"></div>

    <script src="mmt-utils.js"></script>
    <script>
        const SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzMKRviywwQcxb1-rsMztF6aLSyV65punBpF3bPgM3Da49w2vsjfBeIORa3bkUYRCKm/exec";

        // ============================================================
        // HARDCODED INSTITUTION INFO — edit these values as needed
        // ============================================================
       		const COLLEGE_NAME = "Rajarambapu Institute of Technology";
		const DEPARTMENT = "Robotics and Automation";

        // ---- Shared utilities (mmt-utils.js). Fallbacks keep the file working
        //      even if the library fails to load. ----
        const MMT = window.MMT || {
          shuffle: a => a.slice(),
          submitResult: (url, payload) => (!url ? Promise.resolve({sent:false,reason:"no-url"})
            : fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})
                .then(()=>({sent:true})).catch(()=>({sent:false,reason:"network"}))),
          isPractice: () => false,
          modeBanner: () => null,
          downloadReportCard: () => alert("Report card needs mmt-utils.js to be loaded."),
          hintBlock: () => "", toggleHint: () => {}, hintUsed: () => false,
          resetHints: () => {}, applyHintPenalty: (m) => m, hintTag: () => "",
        };
        if (window.MMT) window.MMT._autoFlushUrl = SHEET_WEBHOOK_URL;   // resend queued results on load
        const PRACTICE = MMT.isPractice();

        const ROUNDS = [
            {
                name: "Round 1: Crystal Geometries & Packing",
                intro: "Select an item on the left, then click the correct matching description on the right. Based on L2 notes.",
                hint: "Packing efficiency rises SC → BCC → FCC (52% → 68% → 74%); CN goes 6 → 8 → 12. 'Lattice' = geometry only; 'Coordination Number' = touching neighbours.",
                pairs: [
                    { left: "Simple Cubic (SC)", right: "N=1 atom/cell, APF=52%, CN=6", why: "SC is the least efficient packing structure. Atoms occupy only the 8 corners (8 * 1/8 = 1)." },
                    { left: "Body-Centred Cubic (BCC)", right: "N=2 atoms/cell, APF=68%, CN=8", why: "BCC adds one atom at the geometric center, improving packing efficiency over SC. Example: alpha-Iron." },
                    { left: "Face-Centred Cubic (FCC)", right: "N=4 atoms/cell, APF=74%, CN=12", why: "FCC ties for the maximum packing efficiency. Its close-packed planes make it highly ductile. Example: Aluminum." },
                    { left: "Lattice", right: "An infinite grid of empty positions in space", why: "A lattice describes geometry only. It requires a 'Motif' to become a true crystal structure." },
                    { left: "Coordination Number", right: "The number of nearest-neighbor atoms touching a given atom", why: "A higher CN (like 12 in FCC/HCP vs 8 in BCC) indicates tighter atomic packing." }
                ]
            },
            {
                name: "Round 2: Core Material Properties",
                intro: "Match the engineering property with its exact definition from the L3 notes.",
                hint: "Stiffness→Young's Modulus; plastic deformation before fracture→Ductility; size change with heat→Thermal Expansion; max temperature/bond strength→Melting Point; ease of carrying current→Electrical Conductivity.",
                pairs: [
                    { left: "Young's Modulus", right: "Resistance to elastic deformation (Stiffness)", why: "It is the ratio of stress to strain in the elastic region, driven mostly by interatomic bond strength." },
                    { left: "Ductility", right: "Ability to deform plastically before fracturing", why: "Often expressed as % elongation. FCC metals excel here due to multiple active slip systems." },
                    { left: "Thermal Expansion", right: "Dimensional change as atoms vibrate and push apart", why: "Crucial to account for in robotics assemblies to prevent mismatched expansion joints from warping." },
                    { left: "Melting Point", right: "Dictates max safe operating temperature; relates to bond strength", why: "Tungsten has an exceptionally high value (3422°C) due to massive thermal energy needed to disrupt its strong BCC metallic bonds." },
                    { left: "Electrical Conductivity", right: "Ease of carrying current (inverse of resistivity)", why: "Depends on how freely valence electrons can move through the lattice. Higher in dense, defect-free metallic crystals." }
                ]
            },
            {
                name: "Round 3: Robotics Applications",
                intro: "Match the material structure/property to its specific robotic use case from L3.",
                hint: "Match by the standout trait: ductile/light FCC→arm links; strong BCC steel→gears/shafts; strength-to-weight HCP Ti→aerospace limbs; high conductivity Cu→heat sinks; low expansion Invar→precision joints.",
                pairs: [
                    { left: "FCC Metals (e.g., Aluminium)", right: "Robot arm links & casings needing formability", why: "Their high ductility and low density make them ideal for lightweight structural members that resist sudden fracture." },
                    { left: "BCC Alloy Steels", right: "Drivetrain gears & shafts needing high strength", why: "Strong and wear-resistant, suited to load-bearing components that must resist deformation under cyclic torque." },
                    { left: "HCP Titanium", right: "Aerospace robotic limbs needing high strength-to-weight", why: "Offers excellent strength with low density, minimizing moving mass to reduce actuator load." },
                    { left: "High Thermal Conductivity (Copper)", right: "Heat sinks for motor drivers", why: "Rapidly draws heat away from electronics, preventing thermal shutdown during continuous operation." },
                    { left: "Low Thermal Expansion (Invar)", right: "Precision robotic assemblies & joints", why: "Ensures that varying operating temperatures do not cause fasteners to loosen or structures to warp." }
                ]
            }
        ];

        let state = {
            screen: "start",
            roundIndex: 0,
            activeLeft: null,
            matches: {},
            shuffledRight: [],
            roundScores: [],
            isSubmitting: false,
            submitStatus: null,
            studentName: "",
            studentClass: "",
            prn: ""
        };

        const appEl = document.getElementById("app");

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initRound() {
            state.activeLeft = null;
            state.matches = {};
            MMT.resetHints();
            const round = ROUNDS[state.roundIndex];
            state.shuffledRight = MMT.shuffle(round.pairs.map(p => p.right));   // anti-copying
            state.shuffledLeft = MMT.shuffle(round.pairs);   // anti-copying: randomize left order too
        }

        function retryRound() {
            state.roundScores.pop();              // drop practice attempt's score
            state.submitStatus = null;
            initRound();
            state.screen = "task";
            render();
        }

        function submitResult(payload) {
            return MMT.submitResult(SHEET_WEBHOOK_URL, payload);
        }

        async function handleSubmission() {
            state.isSubmitting = true;
            render();
            
            const round = ROUNDS[state.roundIndex];
            let score = 0;
            const max = round.pairs.length * 10;
            let detailsArr = [];

            const used = MMT.hintUsed('spm'+state.roundIndex);
            const tag = MMT.hintTag(used);
            round.pairs.forEach((pair) => {
                const userMatch = state.matches[pair.left];
                if (userMatch === pair.right) {
                    score += MMT.applyHintPenalty(10, used);
                    detailsArr.push(`[${pair.left}]: Correct${tag}`);
                } else {
                    detailsArr.push(`[${pair.left}]: Wrong (Chose: ${userMatch})${tag}`);
                }
            });

            state.roundScores.push({ score, max });

            // Practice mode — don't record, allow retry
            if (PRACTICE) {
                state.isSubmitting = false;
                state.submitStatus = { ok: false, msg: "Practice mode — not recorded" };
                state.screen = "result";
                render();
                return;
            }

            const payload = {
                game: "Structure & Property Match",
                type: "Type F Match",
                college: COLLEGE_NAME,
                department: DEPARTMENT,
                studentClass: state.studentClass || "",
                prn: state.prn || "",
                name: state.studentName || "Anonymous",
                round: round.name,
                roundNumber: state.roundIndex + 1,
                score: score, max: max,
                percent: Math.round((score / max) * 100),
                details: detailsArr.join(" | ")
            };

            const result = await submitResult(payload);
            state.isSubmitting = false;

            if (result.sent) { state.submitStatus = { ok: true, msg: "✓ Connections saved" }; }
            else if (result.queued) { state.submitStatus = { ok: false, msg: "⏳ Offline — saved, will auto-send" }; }
            else { state.submitStatus = { ok: false, msg: "⚠ Local mode (Offline)" }; }

            state.screen = "result";
            render();
        }

        function clickLeft(leftText) {
            if (state.matches[leftText]) return; // Already matched
            state.activeLeft = (state.activeLeft === leftText) ? null : leftText;
            render();
        }

        function clickRight(rightText) {
            if (!state.activeLeft) return;
            // Check if rightText is already used
            const isUsed = Object.values(state.matches).includes(rightText);
            if (isUsed) return;

            // Make the match
            state.matches[state.activeLeft] = rightText;
            state.activeLeft = null;
            render();
        }

        function startMatching() {
            const name = document.getElementById("student-name").value.trim();
            const cls = document.getElementById("student-class").value.trim();
            const prn = document.getElementById("student-prn").value.trim();
            if (!name || !cls || !prn) {
                let err = document.getElementById('name-error');
                if(!err) {
                    err = document.createElement('div'); err.id = 'name-error';
                    err.style.cssText = 'color:var(--bad); margin-top:8px; font-size:14px; font-weight:500;';
                    document.querySelector('.name-gate').appendChild(err);
                }
                err.innerText = "Please fill in your Name, Class, and PRN.";
                return;
            }
            state.studentName = name;
            state.studentClass = cls;
            state.prn = prn;
            initRound();
            state.screen = "task";
            render();
        }

        function renderStart() {
            appEl.innerHTML = `
                <div class="header">
                    <span class="eyebrow">Connection Match Activity</span>
                    <h1>Material Structures & Properties</h1>
                    <p>Connect concepts from Lecture 2 and 3 to test your vocabulary and application knowledge.</p>
                </div>
                <div class="content">
                    <div class="name-gate">
                        <label>Your Full Name</label>
                        <input type="text" id="student-name" placeholder="e.g. Nicolaus Tesla" value="${state.studentName || ''}" autocomplete="off">
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
                            <div>
                                <label style="margin-top:0;">Class / Section</label>
                                <select id="student-class">
                                    <option value="" ${!state.studentClass ? "selected" : ""} disabled>Select your year…</option>
                                    <option value="FY" ${state.studentClass === "FY" ? "selected" : ""}>FY — First Year</option>
                                    <option value="SY" ${state.studentClass === "SY" ? "selected" : ""}>SY — Second Year</option>
                                    <option value="TY" ${state.studentClass === "TY" ? "selected" : ""}>TY — Third Year</option>
                                    <option value="Final Year" ${state.studentClass === "Final Year" ? "selected" : ""}>Final Year</option>
                                </select>
                            </div>
                            <div>
                                <label style="margin-top:0;">PRN / Roll No.</label>
                                <input type="text" id="student-prn" placeholder="e.g. 2023001234" value="${state.prn || ''}" autocomplete="off">
                            </div>
                        </div>
                        <div style="margin-top:10px;padding:8px 12px;background:var(--card);border-radius:8px;font-size:12px;color:var(--muted);">
                            <b>${COLLEGE_NAME}</b> &middot; ${DEPARTMENT}
                        </div>
                    </div>
                    <ul style="color: var(--muted); margin-left: 20px; line-height: 1.6;">
                        <li><strong>Round 1:</strong> Crystal Geometries & Packing</li>
                        <li><strong>Round 2:</strong> Core Material Properties</li>
                        <li><strong>Round 3:</strong> Robotics Applications</li>
                    </ul>
                </div>
                <div class="footer">
                    <div></div>
                    <button class="btn-primary" onclick="startMatching()">Start Matching</button>
                </div>
            `;
        }

        function renderTask() {
            const round = ROUNDS[state.roundIndex];
            const matchedCount = Object.keys(state.matches).length;
            const isComplete = matchedCount === round.pairs.length;

            const leftHTML = state.shuffledLeft.map(p => {
                const isMatched = !!state.matches[p.left];
                const isActive = state.activeLeft === p.left;
                let classes = "left-item";
                if (isMatched) classes += " matched";
                if (isActive) classes += " active";

                let check = isMatched ? "✓" : "";
                return `<div class="${classes}" onclick="clickLeft('${p.left.replace(/'/g, "\\'")}')">
                            <span>${p.left}</span>
                            <span style="font-weight:bold">${check}</span>
                        </div>`;
            }).join('');

            const rightHTML = state.shuffledRight.map(rText => {
                const isUsed = Object.values(state.matches).includes(rText);
                return `<div class="right-chip ${isUsed ? 'locked' : ''}" onclick="clickRight('${rText.replace(/'/g, "\\'")}')">
                            ${rText}
                        </div>`;
            }).join('');

            const banner = PRACTICE ? '<div style="background:#FBF0DC;color:#9A6B1E;text-align:center;font-weight:600;font-size:13px;padding:9px 14px;border-radius:10px;margin-bottom:14px;border:1px solid #E7C98A;">PRACTICE MODE — results are NOT recorded. Retry freely.</div>' : '';

            appEl.innerHTML = `
                <div class="header">
                    <span class="eyebrow">Round ${state.roundIndex + 1} of ${ROUNDS.length}</span>
                    <h2>${round.name}</h2>
                    <p style="margin-bottom:0;">${round.intro}</p>
                </div>
                <div class="content">
                    ${banner}
                    ${MMT.hintBlock('spm'+state.roundIndex, round.hint)}
                    <div class="match-container">
                        <div class="left-col">${leftHTML}</div>
                        <div class="right-col">${rightHTML}</div>
                    </div>
                </div>
                <div class="footer">
                    <div class="progress-pill">${matchedCount} / ${round.pairs.length} Matched</div>
                    <button class="btn-primary" onclick="handleSubmission()" ${(!isComplete || state.isSubmitting) ? 'disabled' : ''}>
                        ${state.isSubmitting ? 'Evaluating...' : 'Confirm Connections'}
                    </button>
                </div>
            `;
        }

        function renderResult() {
            const round = ROUNDS[state.roundIndex];
            const cScore = state.roundScores[state.roundIndex];
            
            let html = round.pairs.map(pair => {
                const userMatch = state.matches[pair.left];
                const isCorrect = userMatch === pair.right;
                
                return `
                    <div class="result-row ${isCorrect ? 'correct' : 'incorrect'}">
                        <div style="font-size:16px; font-weight:600; margin-bottom:8px; color:var(--graphite);">${pair.left}</div>
                        <div style="font-size:14px; margin-bottom:8px;">
                            <span style="color:var(--muted)">Matched with:</span> 
                            <strong style="color:${isCorrect ? 'var(--good)' : 'var(--bad)'}">${userMatch}</strong>
                            ${!isCorrect ? `<br><span style="color:var(--muted)">Correct answer:</span> <strong>${pair.right}</strong>` : ''}
                        </div>
                        <div style="font-size:14px; color:var(--ink); background:rgba(255,255,255,0.6); padding:10px; border-radius:6px;">
                            ${pair.why}
                        </div>
                    </div>
                `;
            }).join('');

            appEl.innerHTML = `
                <div class="header">
                    <span class="eyebrow">Round ${state.roundIndex + 1} Complete</span>
                    <h2>Match Analysis</h2>
                </div>
                <div class="content">
                    <div class="score-badge">
                        <div class="num">${Math.round((cScore.score/cScore.max)*100)}%</div>
                        <div class="lbl">Accuracy</div>
                    </div>
                    ${html}
                </div>
                <div class="footer">
                    <div class="submit-status ${state.submitStatus?.ok ? 'ok' : 'warn'}">
                        ${state.submitStatus?.msg || ''}
                    </div>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    ${PRACTICE ? '<button class="btn-primary" style="background:var(--steel-light);color:var(--graphite);" onclick="retryRound()">↻ Try this round again</button>' : ''}
                    <button class="btn-primary" onclick="
                        state.roundIndex++;
                        if(state.roundIndex >= ROUNDS.length) state.screen = 'final';
                        else { initRound(); state.screen = 'task'; }
                        render();
                    ">
                        ${state.roundIndex === ROUNDS.length - 1 ? 'Finish Activity' : 'Next Round'}
                    </button>
                    </div>
                </div>
            `;
        }

        function renderFinal() {
            let total = 0, max = 0;
            state.roundScores.forEach(s => { total += s.score; max += s.max; });
            
            appEl.innerHTML = `
                <div class="header">
                    <span class="eyebrow">Connections Complete</span>
                    <h2>Excellent work, ${state.studentName}</h2>
                </div>
                <div class="content" style="text-align:center;">
                    <div class="score-badge" style="width:150px; height:150px; border-radius:75px; margin-top:40px;">
                        <div class="num" style="font-size:42px;">${Math.round((total/max)*100)}%</div>
                        <div class="lbl">Final Score</div>
                    </div>
                    <p>Your property and structure matches have been successfully saved.</p>
        </div>
        <div class="footer" style="justify-content:center; gap:12px;">
            <button class="btn-primary" id="cardBtn">⬇ Download Result Card</button>
            <button class="btn-primary" style="background:transparent;color:var(--copper);border:2px solid var(--copper);" onclick="location.reload()">Restart Activity</button>
        </div>
    `;

            const pct = Math.round((total / max) * 100);
            const cardBtn = document.getElementById("cardBtn");
            if (cardBtn) cardBtn.addEventListener("click", () => {
                MMT.downloadReportCard({
                    activity: "Structure & Property Match",
                    name: state.studentName, studentClass: state.studentClass, prn: state.prn,
                    college: COLLEGE_NAME, department: DEPARTMENT,
                    percent: pct, scoreLine: total + " / " + max + " pts",
                    rating: pct >= 90 ? "Outstanding" : pct >= 70 ? "Great Job" : pct >= 50 ? "Good Effort" : "Keep Practicing",
                    rows: state.roundScores.map((s, idx) => ({ label: ROUNDS[idx].name, value: s.score + " / " + s.max })),
                });
            });
}

function render() {
    if (state.screen === "start") renderStart();
    else if (state.screen === "task") renderTask();
    else if (state.screen === "result") renderResult();
    else if (state.screen === "final") renderFinal();
}

render();
</script>
