<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activities Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--graphite:#1C2B33;--copper:#D98E3B;--steel:#3E5C67;--card:#F4F2EE;--ink:#23343C;--muted:#5C7079;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--graphite);font-family:'Inter',sans-serif;min-height:100vh;padding:40px 16px;}
.wrap{max-width:700px;margin:0 auto;}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--copper);margin-bottom:10px;}
h1{font-family:'Fraunces',serif;color:#fff;font-size:clamp(26px,4vw,38px);margin-bottom:8px;}
.sub{color:#B0C4CC;font-size:15px;margin-bottom:32px;}
.card{background:#fff;border-radius:16px;padding:20px 24px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:16px;text-decoration:none;color:var(--ink);box-shadow:0 4px 20px rgba(0,0,0,.18);transition:transform .15s,box-shadow .15s;cursor:pointer;}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.25);}
.card-title{font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:var(--ink);}
.card-meta{font-size:13px;color:var(--muted);margin-top:3px;}
.card-arrow{font-size:22px;color:var(--copper);flex-shrink:0;}
.dashboard-card{background:var(--copper);}
.dashboard-card .card-title,.dashboard-card .card-meta,.dashboard-card .card-arrow{color:var(--graphite);}
.projector-card{background:var(--steel);}
.projector-card .card-title,.projector-card .card-arrow{color:#fff;}
.projector-card .card-meta{color:#DCEAF1;}
.status{color:#8FA6AE;font-size:13px;text-align:center;padding:14px;}
.empty{color:#B0C4CC;background:rgba(255,255,255,.05);border:1px dashed #3E5C67;border-radius:14px;padding:26px;text-align:center;font-size:14px;}
.card-soon{background:#fff;border-radius:16px;padding:20px 24px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:16px;opacity:0.55;cursor:not-allowed;box-shadow:0 4px 20px rgba(0,0,0,.10);}
.card-soon .card-title{font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:var(--ink);}
.card-soon .card-meta{font-size:13px;color:var(--muted);margin-top:3px;}
.soon-badge{background:#E3EAEC;color:#3E5C67;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:20px;flex-shrink:0;}
.tag-pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-right:5px;margin-top:5px;}
.tag-easy{background:#E7F3EA;color:#3E7A52;}
.tag-medium{background:#FBF0DC;color:#9A6B1E;}
.tag-hard{background:#FBEAEA;color:#A23B3B;}
.tag-unit{background:#DCEAF1;color:#2A5C7A;}
.tag-time{background:#F4F2EE;color:#5C7079;}
.timer-badge{font-size:11px;font-weight:700;background:#FBF0DC;color:#9A6B1E;padding:2px 9px;border-radius:20px;margin-left:6px;}

  /* ============================================================
     MOBILE-HARDENING (universal, appended) — v1
     Fixes: horizontal overflow, small tap targets, font sizing,
            spacing on narrow screens. Safe overrides.
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { max-width: 100%; overflow-x: hidden; }
  img, svg, video, canvas, table { max-width: 100%; height: auto; }
  /* long words / URLs shouldn't push the layout wide */
  p, h1, h2, h3, li, td, th, .chip, .btn { overflow-wrap: break-word; word-break: break-word; }
  /* wrap wide tables in a horizontal scroller instead of breaking the page */
  .table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }

  @media (max-width: 640px) {
    /* comfortable page gutters */
    body { padding-left: 14px; padding-right: 14px; }
    .app, .panel, .wrap, .container, main { max-width: 100% !important; }
    /* tighten oversized card padding on phones */
    .panel { padding: 20px 16px !important; border-radius: 14px !important; }
    /* fluid headings so they never overflow */
    h1 { font-size: clamp(24px, 7vw, 34px) !important; line-height: 1.12; }
    h2 { font-size: clamp(20px, 5.5vw, 26px) !important; }
    h3 { font-size: clamp(17px, 4.8vw, 21px) !important; }
    /* single-column any multi-column grid */
    .missions, .mission-grid, .grid, [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
    /* generous tap targets (Apple/Google guidance = 44px min) */
    .btn, button, .chip, a.card, .card-link, select { min-height: 44px; }
    .chip { padding: 11px 14px !important; font-size: 14px !important; }
    .btn, button { padding: 13px 18px !important; font-size: 15px !important; }
    /* inputs at >=16px stop iOS from auto-zooming on focus */
    input, select, textarea { font-size: 16px !important; width: 100%; }
    /* stack any flex header rows */
    .top, .mission-header, .score-hero, .app-header, header { flex-wrap: wrap; }
  }
  @media (max-width: 380px) {
    .panel { padding: 16px 12px !important; }
    .chip { font-size: 13.5px !important; }
  }


@media print { body { background: white !important; color: black !important; } .name-gate, .btn, button, .top-bar, .actions { display: none !important; } .mission-card, .round-card, .card { display: block !important; box-shadow: none !important; border: 1px solid #ccc !important; margin-bottom: 20px !important; page-break-inside: avoid; } .hidden { display: block !important; } .mcq-option::before { content: '[  ] '; font-family: monospace; } .category-bucket { border: 1px solid #000 !important; min-height: 150px; } }
</style>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Interactive Classroom</p>
  <h1>Activities Hub</h1>
  <p class="sub">Select an activity below to begin.</p>

  <a class="card dashboard-card" href="dashboard.html" target="_blank">
    <div class="card-info">
      <div class="card-title">Instructor Dashboard</div>
      <div class="card-meta">Live analytics - All student results</div>
    </div>
    <div class="card-arrow">&rarr;</div>
  </a>

  <a class="card projector-card" href="projector.html" target="_blank">
    <div class="card-info">
      <div class="card-title">📺 Projector / Live Mode</div>
      <div class="card-meta">Front-of-class leaderboard - auto-refreshing</div>
    </div>
    <div class="card-arrow">&rarr;</div>
  </a>

  <div id="activityList">
    <p class="status">Loading activities&hellip;</p>
  </div>
</div>

<script>
// ============ BACKEND URL ============
const firebaseConfig = {
  apiKey: "AIzaSyBsk-Pfqd26dFXMU04ye-gfA3uYSKR5Aps",
  authDomain: "activity-2026.firebaseapp.com",
  databaseURL: "https://activity-2026-default-rtdb.firebaseio.com",
  projectId: "activity-2026",
  storageBucket: "activity-2026.firebasestorage.app",
  messagingSenderId: "384955850563",
  appId: "1:384955850563:web:6ea833f95a6300845759f6"
};
if (typeof firebase !== 'undefined' && !firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

// ============ FALLBACK (shown if backend is slow/offline) ============
// Empty - if the database is unreachable, show nothing rather than stale data.
var FALLBACK = [];

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function renderCards(list){
  var box = document.getElementById("activityList");
  if(!list || !list.length){
    box.innerHTML = '<div class="empty">No activities are open right now. Check back shortly.</div>';
    return;
  }
  var html = "";
  list.forEach(function(a){
    if(!a.file) return;
    var visible = String(a.visible || '').toUpperCase();
    if (visible === 'NO' || visible === 'OFF') return;
    var isSoon = (visible === 'SOON');

    // Build tag pills
    var tags = '';
    if (a.difficulty) {
      var dc = a.difficulty.toLowerCase() === 'easy' ? 'easy' : a.difficulty.toLowerCase() === 'hard' ? 'hard' : 'medium';
      tags += '<span class="tag-pill tag-' + dc + '">' + esc(a.difficulty) + '</span>';
    }
    if (a.unit) tags += '<span class="tag-pill tag-unit">📚 ' + esc(a.unit) + '</span>';
    if (a.duration && !a.timerMinutes) tags += '<span class="tag-pill tag-time">🕐 ' + esc(a.duration) + '</span>';
    if (a.timerMinutes > 0) tags += '<span class="timer-badge">⏱ ' + esc(a.timerMinutes) + ' min</span>';
    var tagsHtml = tags ? '<div style="margin-top:6px;">' + tags + '</div>' : '';

    var metaText = a.meta ? '<div class="card-meta">' + esc(a.meta) + '</div>' : '';

    // Build href with timer param
    var href = esc(a.file);
    if (a.timerMinutes > 0) href = esc(a.file + '?timed=' + (a.timerMinutes * 60));

    if (isSoon) {
      html += '<div class="card-soon">' +
                '<div class="card-info">' +
                  '<div class="card-title">' + esc(a.name || a.file) + '</div>' +
                  metaText +
                  '<div class="card-meta" style="margin-top:4px;">🔜 Coming Soon</div>' +
                '</div>' +
                '<span class="soon-badge">SOON</span>' +
              '</div>';
    } else {
      html += '<a class="card" href="' + href + '">' +
                '<div class="card-info">' +
                  '<div class="card-title">' + esc(a.name || a.file) + '</div>' +
                  metaText +
                  tagsHtml +
                '</div>' +
                '<div class="card-arrow">&rarr;</div>' +
              '</a>';
    }
  });
  box.innerHTML = html;
}

async function loadConfig() {
  try {
    const snap = await db.ref("config/main").once("value");
    const data = snap.exists() ? snap.val() : { activities: [] };
    const acts = data.activities || [];
    if(acts.length === 0) throw new Error("empty");
    renderCards(acts);
  } catch(e) {
    document.getElementById("cards").innerHTML = 
      '<div style="text-align:center;padding:40px;color:var(--muted);width:100%;">' +
      '<p style="font-size:16px;">Failed to load live activities.</p></div>';
  }
}

loadConfig();
</script>
<div class="cr-copyright" style="text-align:center;padding:12px 16px;font-size:12px;color:#64748b;font-family:system-ui,Segoe UI,Arial,sans-serif;">&copy; 2026 Prof. Nilesh Vijay Sabnis (9890880549)</div>
</body>
</html>
