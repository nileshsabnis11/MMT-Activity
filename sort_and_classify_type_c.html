<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casting Sort & Classify</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
  
  <!-- Firebase for Database -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="mmt-utils.js"></script>

  <style>
    :root {
      --graphite:#1C2B33; --graphite2:#142027; --steel:#3E5C67; --steel-light:#E3EAEC;
      --copper:#D98E3B; --copper-light:#F6E4C8; --robot-blue:#2A5C7A; --robot-blue-light:#DCEAF1;
      --ink:#23343C; --muted:#5C7079; --card:#F4F2EE; --white:#FFFFFF;
      --good:#3E7A52; --good-bg:#E7F3EA; --warn:#9A6B1E; --warn-bg:#FBF0DC;
      --bad:#A23B3B; --bad-bg:#FBEAEA;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
      background: var(--graphite); color: var(--ink); font-family: 'Inter', sans-serif;
      padding: 20px;
    }

    .app-container { width: 100%; max-width: 850px; flex-grow: 1; display: flex; flex-direction: column; }
    .panel { background: var(--white); border-radius: 18px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.35); margin-bottom: 20px; }
    
    h1, h2, h3 { font-family: 'Fraunces', serif; color: var(--graphite); }
    h1 { font-size: 32px; font-weight: 700; margin-bottom: 12px; }
    h2 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
    p { line-height: 1.6; color: var(--muted); margin-bottom: 16px; }

    .eyebrow { color: var(--copper); font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }

    .name-gate { background: var(--robot-blue-light); padding: 24px; border-radius: 12px; margin-bottom: 24px; }
    .input-group { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    input, select { 
      flex: 1; min-width: 200px; padding: 12px 16px; border: 1px solid var(--steel-light); 
      border-radius: 8px; font-family: inherit; font-size: 15px; outline: none;
    }
    input:focus, select:focus { border-color: var(--robot-blue); box-shadow: 0 0 0 3px rgba(42,92,122,0.1); }
    .error-msg { color: var(--bad); font-size: 14px; font-weight: 600; margin-bottom: 12px; display: none; }

    .btn-primary { 
      background: var(--copper); color: white; border: none; padding: 14px 24px; 
      font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; 
      transition: opacity 0.2s; font-family: inherit;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { background: var(--muted); opacity: 0.5; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--muted); }
    .btn-ghost:hover { background: var(--steel-light); color: var(--ink); }

    .sort-item { background: var(--card); border: 1px solid var(--steel-light); border-radius: 12px; padding: 16px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
    .item-name { font-size: 16px; font-weight: 600; color: var(--ink); }
    .cat-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { 
      background: var(--white); border: 1px solid var(--steel-light); padding: 10px 16px; 
      border-radius: 20px; font-size: 14px; font-weight: 500; cursor: pointer; 
      transition: all 0.2s; color: var(--muted);
    }
    .chip:hover { border-color: var(--robot-blue); color: var(--robot-blue); }
    .chip.selected { background: var(--robot-blue); color: white; border-color: var(--robot-blue); font-weight: 600; }

    .result-card { border-radius: 8px; padding: 16px; margin-bottom: 16px; font-size: 15px; line-height:1.5; }
    .result-card.good { background: var(--good-bg); color: #1f452b; border: 1px solid #C3DFC9; }
    .result-card.bad { background: var(--bad-bg); color: #5a1919; border: 1px solid #E8C9C9; }
    
    .score-hero { text-align: center; margin: 40px 0; }
    .score-badge { display: inline-flex; align-items: center; justify-content: center; width: 120px; height: 120px; border-radius: 60px; background: var(--graphite); color: var(--white); font-size: 32px; font-weight: 800; font-family: 'Fraunces', serif; margin-bottom: 16px; }
    
    .submit-status { font-size: 14px; text-align: center; margin-top: 16px; font-weight: 500; }
    .submit-status.ok { color: var(--good); }
    .submit-status.warn { color: var(--warn); }
    
    .hidden { display: none !important; }
    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--steel-light); }
    .flex-actions { display: flex; gap: 12px; justify-content: center; margin-top: 24px; }

    /* ===== MOBILE-HARDENING (paste in every activity) ===== */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    html, body { max-width: 100%; overflow-x: hidden; }
    img, svg, video, canvas, table { max-width: 100%; height: auto; }
    p, h1, h2, h3, li, td, th, .chip, .btn { overflow-wrap: break-word; word-break: break-word; }
    .table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    @media (max-width: 640px) {
      body { padding-left: 14px; padding-right: 14px; }
      .app-container, .panel { max-width: 100% !important; }
      .panel { padding: 20px 16px !important; border-radius: 14px !important; }
      h1 { font-size: clamp(24px, 7vw, 34px) !important; line-height: 1.12; }
      h2 { font-size: clamp(20px, 5.5vw, 26px) !important; }
      h3 { font-size: clamp(17px, 4.8vw, 21px) !important; }
      .btn-primary, button, .chip, select { min-height: 44px; }
      .chip { padding: 11px 14px !important; font-size: 14px !important; }
      input, select { font-size: 16px !important; width: 100%; }
      .action-bar { flex-direction: column; gap: 16px; align-items: stretch; text-align: center; }
      .flex-actions { flex-direction: column; }
    }
  
@media print { body { background: white !important; color: black !important; } .name-gate, .btn, button, .top-bar, .actions { display: none !important; } .mission-card, .round-card, .card { display: block !important; box-shadow: none !important; border: 1px solid #ccc !important; margin-bottom: 20px !important; page-break-inside: avoid; } .hidden { display: block !important; } .mcq-option::before { content: '[  ] '; font-family: monospace; } .category-bucket { border: 1px solid #000 !important; min-height: 150px; } }
</style>
</head>
<body>
  <div class="app-container">
    <div class="panel" id="app"></div>
  </div>
  <div class="cr-copyright" style="text-align:center;padding:12px 16px;font-size:12px;color:#64748b;font-family:system-ui,Segoe UI,Arial,sans-serif;">&copy; 2026 Prof. Nilesh Vijay Sabnis (9890880549)</div>

  <script>
    const MMT = window.MMT || {
      shuffle: a => a.slice(), pickPool: (a,n) => a.slice(0,n),
      submitResult: (db, payload) => Promise.resolve({sent:false, reason:"missing utils"}),
      isPractice: () => false, modeBanner: () => null,
      downloadReportCard: () => alert("Report card needs mmt-utils.js to be loaded."),
      hintBlock: () => "", toggleHint: () => {}, hintUsed: () => false,
      resetHints: () => {}, applyHintPenalty: (m) => m, hintTag: () => "",
      markStart: () => {}, getTimeTaken: () => null, fmtTime: () => '—',
      startTimer: (cb) => {}, getTimerSeconds: () => 0,
      renderBadge: (pct) => "",
    };

    const COLLEGE_NAME = "Rajarambapu Institute of Technology";
    const DEPARTMENT   = "Robotics and Automation";
    const DB_ENABLED   = true;

    if (window.MMT) window.MMT._autoFlushUrl = DB_ENABLED;
    const PRACTICE = MMT.isPractice();

    const ROUNDS = [
      {
        name: "Round 1: Mold Families",
        intro: "Classify each specific casting process into its correct family based on whether the mold is destroyed or reused.",
        hint: "Does the process use sand/plaster/ceramic (destroyed), or metal (reused)?",
        categories: ["Expendable Mold", "Permanent Mold"],
        items: [
          { name: "Sand Casting", correctCategory: "Expendable Mold", why: "The sand mold is broken apart to extract every casting." },
          { name: "Centrifugal Casting", correctCategory: "Permanent Mold", why: "Uses a reusable metal mold that spins rapidly." },
          { name: "Investment (Lost-Wax) Casting", correctCategory: "Expendable Mold", why: "The ceramic shell must be broken off to reveal the final metal part." },
          { name: "Plaster Mold Casting", correctCategory: "Expendable Mold", why: "The plaster of Paris mold is destroyed upon part removal." },
          { name: "Evaporative (Lost-Foam) Casting", correctCategory: "Expendable Mold", why: "Both the foam pattern (vaporized) and the sand mold are lost in each cycle." }
        ]
      },
      {
        name: "Round 2: Process Characteristics",
        intro: "Assign these manufacturing characteristics to the mold family they describe.",
        hint: "Which one requires expensive upfront tooling, and which one is slow per part?",
        categories: ["Expendable Mold", "Permanent Mold"],
        items: [
          { name: "Economical for High-Volume Production", correctCategory: "Permanent Mold", why: "Once the expensive metal mold is made, per-part costs drop drastically." },
          { name: "Allows Highly Complex Internal Features", correctCategory: "Expendable Mold", why: "Because the mold is destroyed, you don't need to worry about the part getting 'stuck' inside a rigid mold." },
          { name: "Production rate limited by mold-making time", correctCategory: "Expendable Mold", why: "A brand new mold must be built from scratch for every single component." },
          { name: "Part shapes are limited to allow ejection", correctCategory: "Permanent Mold", why: "The solid part must be able to pop out of the rigid metal mold halves." }
        ]
      },
      {
        name: "Round 3: Material Capabilities",
        intro: "Classify processes based on the metals they can safely handle.",
        hint: "Consider the melting point of ferrous metals (like steel/iron) vs non-ferrous.",
        categories: ["Ferrous & Non-Ferrous", "Non-Ferrous Only"],
        items: [
          { name: "Sand Casting", correctCategory: "Ferrous & Non-Ferrous", why: "Sand can easily withstand the high pouring temperatures of cast iron and steel." },
          { name: "Plaster Mold Casting", correctCategory: "Non-Ferrous Only", why: "Plaster cannot survive the extreme heat of steel; it's limited to aluminum, zinc, and copper alloys." },
          { name: "Investment Casting", correctCategory: "Ferrous & Non-Ferrous", why: "The tough ceramic shell handles superalloys, steel, and aluminum easily." },
          { name: "Evaporative Casting", correctCategory: "Ferrous & Non-Ferrous", why: "Works for both material groups, as the refractory-coated sand can withstand high heat." }
        ]
      }
    ];

    let state = {
      screen: "start", roundIndex: 0, studentName: "", studentClass: "", prn: "",
      placements: {}, roundScores: []
    };

    const app = document.getElementById("app");

    function render() {
      app.innerHTML = "";
      const banner = MMT.modeBanner();
      if (banner) app.appendChild(banner);

      if (state.screen === "start") {
        app.innerHTML += `
          <div class="eyebrow">Unit 3 · Lecture 1</div>
          <h1>Casting Classification</h1>
          <p>Organize casting processes and properties into their proper technical families.</p>
          
          <div class="name-gate">
            <div id="gateError" class="error-msg">Please fill in your Name, Class, and PRN.</div>
            <div class="input-group">
              <input type="text" id="nameInput" placeholder="Full Name" value="${state.studentName}">
              <select id="classInput">
                <option value="" disabled ${!state.studentClass ? "selected" : ""}>Select Class...</option>
                <option value="FY" ${state.studentClass === "FY" ? "selected" : ""}>FY — First Year</option>
                <option value="SY" ${state.studentClass === "SY" ? "selected" : ""}>SY — Second Year</option>
                <option value="TY" ${state.studentClass === "TY" ? "selected" : ""}>TY — Third Year</option>
                <option value="Final Year" ${state.studentClass === "Final Year" ? "selected" : ""}>Final Year</option>
              </select>
              <input type="text" id="prnInput" placeholder="PRN / Roll No." value="${state.prn}">
            </div>
            <button class="btn-primary" onclick="startActivity()" style="width:100%">Begin Sorting</button>
          </div>
        `;
      } 
      else if (state.screen === "task") {
        const round = ROUNDS[state.roundIndex];
        const isComplete = Object.keys(state.placements).length === round.items.length;

        let html = `
          <div class="eyebrow">Round ${state.roundIndex + 1} of 3</div>
          <h2>${round.name}</h2>
          <p>${round.intro}</p>
          ${MMT.hintBlock('r'+state.roundIndex, round.hint)}
          
          <div style="margin-top:24px;">
            ${round.items.map((item, i) => `
              <div class="sort-item">
                <div class="item-name">${item.name}</div>
                <div class="cat-chips">
                  ${round.categories.map(cat => `
                    <button class="chip ${state.placements[i] === cat ? 'selected' : ''}" 
                            onclick="placeItem(${i}, '${cat}')">
                      ${cat}
                    </button>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>
          
          <div class="action-bar">
            <span style="color:var(--muted); font-size:14px; font-weight:600;">
              ${Object.keys(state.placements).length} / ${round.items.length} Placed
            </span>
            <button class="btn-primary" onclick="submitRound()" ${!isComplete ? "disabled" : ""}>
              Submit Categories
            </button>
          </div>
        `;
        app.innerHTML += html;
      }
      else if (state.screen === "results") {
        const round = ROUNDS[state.roundIndex];
        let score = 0;
        let max = round.items.length * 10;
        let detailsArr = [];
        const usedHint = MMT.hintUsed('r'+state.roundIndex);
        const hintTag = MMT.hintTag(usedHint);

        let resultsHtml = round.items.map((item, i) => {
          const picked = state.placements[i];
          const isCorrect = picked === item.correctCategory;
          
          let earned = 0;
          if (isCorrect) {
            earned = MMT.applyHintPenalty(10, usedHint);
            score += earned;
            detailsArr.push(`[${item.name}]: Correct${hintTag}`);
          } else {
            detailsArr.push(`[${item.name}]: Wrong (Picked ${picked}, was ${item.correctCategory})${hintTag}`);
          }
          
          return `
            <div class="result-card ${isCorrect ? 'good' : 'bad'}">
              <div style="font-weight:700; margin-bottom:8px;">${item.name}</div>
              <div style="margin-bottom:8px;">
                <strong>Category: ${item.correctCategory}</strong> 
                ${!isCorrect ? `<br><span style="color:var(--bad); font-size:13px;">(You placed in: ${picked})</span>` : ''}
              </div>
              <div style="font-size:14px;">${item.why}</div>
            </div>
          `;
        }).join('');

        state.roundScores.push({ score, max });
        
        if (!PRACTICE) {
          MMT.submitResult(DB_ENABLED, {
            game: "Casting Sort & Classify", type: "Type C",
            college: COLLEGE_NAME, department: DEPARTMENT,
            name: state.studentName, studentClass: state.studentClass, prn: state.prn,
            round: round.name, roundNumber: state.roundIndex + 1,
            score: score, max: max, percent: Math.round((score/max)*100),
            details: detailsArr.join(" | "), timeTaken: MMT.getTimeTaken()
          }).then(res => {
            const el = document.getElementById("submitStatus");
            if(el) {
              if(res.sent) { el.textContent = "✓ Result saved"; el.className = "submit-status ok"; }
              else if(res.queued) { el.textContent = "⏳ Offline — saved, will auto-send later"; el.className = "submit-status warn"; }
              else { el.textContent = "⚠ Couldn't reach the database"; el.className = "submit-status warn"; }
            }
          });
        }

        app.innerHTML += `
          <div class="eyebrow">Round ${state.roundIndex + 1} Review</div>
          <h2>Classification Complete</h2>
          
          <div style="font-size:18px; font-weight:700; margin-bottom:24px;">
            Score: ${score} / ${max} ${usedHint && !PRACTICE ? '<span style="color:var(--warn);font-size:14px">(Hint Used)</span>' : ''}
          </div>
          ${resultsHtml}
          <div id="submitStatus" class="submit-status"></div>
          
          <div class="action-bar">
            <div></div>
            <button class="btn-primary" onclick="nextRound()">
              ${state.roundIndex < ROUNDS.length - 1 ? 'Next Round →' : 'View Final Report'}
            </button>
          </div>
        `;
      }
      else if (state.screen === "final") {
        let tScore = 0, tMax = 0;
        state.roundScores.forEach(s => { tScore += s.score; tMax += s.max; });
        const pct = Math.round((tScore/tMax)*100);
        
        let html = `
          <div class="eyebrow">Assessment Complete</div>
          <h2>Final Engineering Report</h2>
          <div class="score-hero">
            ${MMT.renderBadge(pct)}
            <div class="score-badge">${pct}%</div>
            <div>Total Score: ${tScore} / ${tMax} pts</div>
          </div>
          
          <div style="background:var(--card); padding:20px; border-radius:12px; margin-bottom:24px;">
            <h3 style="margin-bottom:12px;">Round Breakdown</h3>
            ${state.roundScores.map((s,i) => `
              <div style="display:flex; justify-content:space-between; margin-bottom:8px; border-bottom:1px solid var(--steel-light); padding-bottom:8px;">
                <span>${ROUNDS[i].name}</span>
                <strong>${s.score} / ${s.max}</strong>
              </div>
            `).join('')}
          </div>
          
          <div class="flex-actions">
            <button class="btn-primary" id="downloadBtn">⬇ Download Report Card</button>
            <button class="btn-primary btn-ghost" onclick="location.reload()">Restart Challenge</button>
          </div>
        `;
        app.innerHTML += html;

        document.getElementById("downloadBtn").addEventListener("click", () => {
          MMT.downloadReportCard({
            activity: "Casting Sort & Classify",
            name: state.studentName, studentClass: state.studentClass, prn: state.prn,
            college: COLLEGE_NAME, department: DEPARTMENT,
            percent: pct, scoreLine: tScore + " / " + tMax + " pts",
            rating: pct>=90?"Taxonomy Master":pct>=70?"Solid Sorting":pct>=50?"Good Effort":"Review Families",
            rows: state.roundScores.map((s,i) => ({ label: ROUNDS[i].name, value: s.score+" / "+s.max }))
          });
        });
      }
    }

    window.startActivity = function() {
      const n = document.getElementById("nameInput").value.trim();
      const c = document.getElementById("classInput").value;
      const p = document.getElementById("prnInput").value.trim();
      if (!n || !c || !p) { 
        document.getElementById("gateError").style.display = "block";
        return; 
      }
      
      state.studentName = n; state.studentClass = c; state.prn = p;
      state.screen = "task";
      MMT.markStart();
      MMT.resetHints();
      render();
    };

    window.placeItem = function(itemIndex, category) {
      state.placements[itemIndex] = category;
      render();
    };

    window.submitRound = function() {
      state.screen = "results";
      render();
    };

    window.nextRound = function() {
      state.roundIndex++;
      state.placements = {};
      MMT.resetHints();
      if (state.roundIndex >= ROUNDS.length) {
        state.screen = "final";
      } else {
        state.screen = "task";
      }
      render();
    };

    render();
  </script>
</body>
</html>
